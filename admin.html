<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Fruit Basket - Admin Panel</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <header class="header">
        <h1>🍎 Fresh Fruit Basket - Admin Panel</h1>
    </header>

    <div class="dashboard">

        <div class="card">
            <h2>Total Orders</h2>
            <h3 id="totalOrders">0</h3>
        </div>

        <div class="card">
            <h2>Pending Orders</h2>
            <h3 id="pendingOrders">0</h3>
        </div>

        <div class="card">
            <h2>Delivered Orders</h2>
            <h3 id="deliveredOrders">0</h3>
        </div>

        <div class="card">
            <h2>Total Sales</h2>
            <h3>₹<span id="totalSales">0</span></h3>
        </div>

    </div>

<h2 style="text-align:center; margin-top:30px;">
Add New Product
</h2>

<form id="productForm" class="product-form">

    <input
        type="text"
        id="productName"
        placeholder="Product Name"
        required>

    <input
        type="number"
        id="productPrice"
        placeholder="Price"
        required>

    <input
        type="text"
        id="productImage"
        placeholder="Image Path (images/apple.jpg)"
        required>

    <input
        type="text"
        id="productCategory"
        placeholder="Category"
        required>

    <button type="submit">
        Add Product
    </button>

</form>

    <h2 style="text-align:center;">Customer Orders</h2>

    
<table border="1" width="100%" cellspacing="0">

    <thead>

        <tr>

            <th>Order ID</th>
            <th>Customer</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Payment</th>
            <th>Transaction ID</th>
            <th>Total</th>
            <th>Status</th>
            <th>Action</th>

        </tr>

    </thead>

    <tbody id="ordersTable">

    </tbody>

</table>
    <script type="module" src="admin.js"></script>

</body>
</html>
