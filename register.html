<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Fresh Fruit Basket</title>

<link rel="stylesheet" href="register.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="background">

<div class="circle one"></div>
<div class="circle two"></div>
<div class="circle three"></div>

</div>


<div class="register-wrapper">

<div class="left-side">

<div class="brand">

<h1> Fresh Fruit Basket</h1>

<p>
Fresh • Organic • Healthy
</p>

</div>

<div class="welcome-text">

<h2>Create Your Account</h2>

<p>

Join thousands of happy customers and enjoy
fresh fruits delivered directly to your doorstep.

</p>

</div>

<div class="features">

<div class="feature">

<i class="fa-solid fa-truck-fast"></i>

<span>Fast Delivery</span>

</div>

<div class="feature">

<i class="fa-solid fa-leaf"></i>

<span>100% Fresh Fruits</span>

</div>

<div class="feature">

<i class="fa-solid fa-shield-heart"></i>

<span>Trusted Quality</span>

</div>

</div>

</div>


<div class="register-card">

<h2>Create Account</h2>

<p>Start your healthy journey today.</p>


<form id="registerForm">

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input
type="text"
id="name"
placeholder="Full Name"
required>

</div>


<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>


<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

</div>


<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

</div>


<button
class="register-btn"
type="submit">

Create Account

</button>


<div class="divider">

<span>OR</span>

</div>


<button
type="button"
class="google-btn">

<i class="fa-brands fa-google"></i>

Continue with Google

</button>


<div class="login-link">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</form>

</div>

</div>

<script type="module" src="auth.js"></script>

</body>

</html>
